<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Zombros</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2024; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8e6e1; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      canvas { display: block; touch-action: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: none; }

      .compass { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; width: 360px; max-width: 70vw; height: 24px; transform: translateX(-50%); overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
      .compass-strip { position: absolute; left: 50%; top: 0; height: 100%; }
      .tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: rgba(255,255,255,0.55); }
      .tick.major { height: 24px; width: 30px; margin-left: -15px; background: none; text-align: center; font-weight: 600; letter-spacing: 0.05em; text-shadow: 0 1px 2px #000; }
      .compass-mark { position: absolute; left: 50%; top: 0; width: 2px; height: 5px; margin-left: -1px; background: #ffd58a; }
      .clock { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 26px); left: 50%; transform: translateX(-50%); font-size: 11px; opacity: 0.75; text-shadow: 0 1px 2px #000; }
      .crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 0 2px #000; }
      .debug { position: absolute; top: 10px; left: 10px; white-space: pre; font: 11px/1.45 ui-monospace, monospace; background: rgba(15,17,20,0.7); padding: 8px 10px; border-radius: 6px; display: none; }
      .debug.on { display: block; }
      .help { position: absolute; right: 12px; top: 12px; background: rgba(15,17,20,0.8); padding: 10px 12px; border-radius: 8px; display: none; }
      .help.on { display: block; }
      .keys { border-collapse: collapse; }
      .keys th { text-align: left; font-weight: 600; opacity: 0.6; padding: 0 10px 4px 0; }
      .keys td { padding: 2px 10px 2px 0; }
      .keys td:first-child { opacity: 0.75; }
      .small { font-size: 11px; opacity: 0.6; margin: 8px 0 0; }
      .start { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,12,16,0.45); pointer-events: auto !important; cursor: pointer; }
      .start.on { display: flex; }
      .start .card { background: rgba(15,17,20,0.88); padding: 18px 22px; border-radius: 10px; max-width: calc(100vw - 32px); }
      .start h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 0.08em; }
      .start .go { margin: 0 0 12px; color: #ffd58a; font-weight: 600; }
      .loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #1d2024; font-size: 15px; letter-spacing: 0.04em; }
      .loading.on { display: flex; }

      /* Touch controls: hidden until the screen is touched. */
      #touch { position: fixed; inset: 0; display: none; touch-action: none; }
      body.touch #touch { display: block; }
      body.touch .start { display: none !important; }
      .stick-base { position: absolute; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); display: none; }
      .stick-base.on { display: block; }
      .stick-knob { position: absolute; left: 32px; top: 32px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.35); }
      .stick-knob.sprint { background: rgba(255,213,138,0.7); }
      .touch-buttons { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }
      .touch-btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(20,22,26,0.45); color: #e8e6e1; font: 600 11px system-ui, sans-serif; touch-action: none; }
      .touch-btn:active { background: rgba(255,255,255,0.25); }
      .touch-view { grid-column: 2; }
      .touch-jump { grid-column: 2; }
      .rotate { display: none; }
      @media (orientation: portrait) {
        body.touch .rotate { display: flex; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(10,12,16,0.85); font-size: 15px; z-index: 5; }
      }
    </style>
  </head>
  <body>
    <div id="touch"></div>
    <div id="ui"></div>
    <div class="rotate">Turn your phone sideways</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
